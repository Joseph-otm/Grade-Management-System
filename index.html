<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class Results</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="login-logo">

                <img
                    src="images/class-logo.png"
                    alt="Logo de notre classe"
                >

            </div>


            <!-- =========================
                 TITRE
            ========================== -->

            <div class="login-header">

                <span class="login-badge">
                    🎓 Espace de la classe
                </span>

                <h1>
                    Klassennoten
                </h1>

                <p>
                    Consultez vos résultats scolaires
                    en toute simplicité.
                </p>

            </div>


            <!-- =========================
                 FORMULAIRE
            ========================== -->

            <form id="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        📧 Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="student01@test.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        🔒 Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- CONNEXION -->

                <button
                    type="submit"
                    class="login-button"
                >

                    <span>
                        Se connecter
                    </span>

                    <span class="login-arrow">
                        →
                    </span>

                </button>


                <!-- MESSAGE -->

                <p
                    id="message"
                    class="login-message"
                ></p>


            </form>


            <!-- =========================
                 FOOTER
            ========================== -->

            <div class="login-footer">

                <span>
                    🔐 Connexion sécurisée
                </span>

                <span>
                    •
                </span>

                <span>
                    Class Results
                </span>

            </div>


        </div>


    </div>



    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- CONFIGURATION -->

    <script src="js/config.js"></script>


    <!-- AUTHENTIFICATION -->

    <script src="js/auth.js"></script>


</body>

</html>
